<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Session bus: any app in the user's own session may call
       Inhibit / UnInhibit on either surface (a video player, a
       presentation app, ...). Nothing here needs system-bus-style
       cross-user restriction: the session bus is already per-user.

       The daemon owns two well-known names: its native one and the
       org.freedesktop.ScreenSaver compatibility name (taken with
       ReplaceExisting so a stale owner cannot strand video players).
       Ownership is explicit here for auditability, even though the
       default session policy allows it. -->
  <policy context="default">
    <allow send_destination="os.lionos.Idle"/>
    <allow receive_sender="os.lionos.Idle"/>
    <allow send_destination="org.freedesktop.ScreenSaver"/>
    <allow receive_sender="org.freedesktop.ScreenSaver"/>
  </policy>
</busconfig>
